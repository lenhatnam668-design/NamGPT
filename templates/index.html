<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bestie AI - Trợ lý học tập</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #ec4899;
      --primary-hover: #db2777;
      --bg-home: #fdf2f8;
      --bg-chat: #fff5f7;
      --sidebar-bg: #ffffff;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #fbcfe8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-home);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Màn hình trang chủ (Home Section) */
    .home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      text-align: center;
      background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .logo span { color: #f472b6; }

    .mascot {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .tag {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--primary);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .home h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 16px;
      color: #111827;
    }

    .home h1 span { color: var(--primary); }

    .intro {
      max-width: 500px;
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(236, 72, 153, 0.35);
      transition: all 0.2s ease;
      margin-bottom: 40px;
    }

    button.primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
    }

    .features {
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .features div {
      background: white;
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Giao diện Chat Page */
    .chat-page {
      display: flex;
      height: 100vh;
      background: var(--bg-chat);
    }

    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .sidebar .logo {
      text-align: left;
      margin-bottom: 20px;
    }

    .sidebar button#newChat {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .sidebar button#newChat:hover { background: var(--primary-hover); }

    .sidebar h4 {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    #history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      list-style: none;
      margin-bottom: 16px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #4b5563;
      background: #fdf2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.2s;
    }
    .history-item:hover { background: #fce7f3; color: var(--primary); }

    button.secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    button.secondary:hover { background: #fdf2f8; color: var(--primary); }

    /* Main Chat Layout */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat header {
      padding: 16px 24px;
      background: white;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat header div b { display: block; font-size: 16px; color: #111827; }
    .chat header div small { color: var(--text-muted); font-size: 12px; }

    .messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .welcome {
      max-width: 600px;
      width: 100%;
      margin: auto;
      text-align: center;
      padding: 20px;
    }

    .welcome .mascot.small { font-size: 42px; margin-bottom: 10px; }
    .welcome h2 { font-size: 26px; font-weight: 800; color: #111827; margin-bottom: 8px; }
    .welcome p { color: var(--text-muted); font-size: 15px; margin-bottom: 20px; }

    button.suggest {
      display: block;
      width: 100%;
      background: white;
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s;
    }
    button.suggest:hover {
      border-color: var(--primary);
      background: #fdf2f8;
      color: var(--primary);
    }

    /* Khung tin nhắn */
    .message-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message {
      background: var(--primary);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    .bot-message {
      background: white;
      color: var(--text-main);
      align-self: flex-start;
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px
